name: Rebuild frame timeline

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:47 IST
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools uharfbuzz
      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_static.py
          python scripts/build_frames.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: rebuild profile graphics"
          git pull --rebase && git push
