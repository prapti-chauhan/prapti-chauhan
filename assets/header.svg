<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15150F"/>
      <stop offset="0.55" stop-color="#167670"/>
      <stop offset="1" stop-color="#1E9E96"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#E9EDEE}
      .name{font-size:64px;font-weight:800;letter-spacing:1px;opacity:0;animation:up 1s ease-out .2s forwards}
      .sub{font-size:22px;font-weight:500;opacity:0;animation:up 1s ease-out .7s forwards}
      .w1{animation:drift 9s ease-in-out infinite alternate}
      .w2{animation:drift 13s ease-in-out infinite alternate-reverse}
      @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
    </style>
  </defs>
  <rect width="1200" height="260" fill="url(#g)"/>
  <g class="w2" opacity="0.25">
    <path d="M0 205 C150 175 300 235 450 205 S750 175 900 205 S1200 235 1350 205 L1350 260 L0 260Z" fill="#E9EDEE"/>
  </g>
  <g class="w1" opacity="0.12">
    <path d="M0 220 C200 250 350 190 550 220 S850 250 1050 220 S1300 190 1400 220 L1400 260 L0 260Z" fill="#E9EDEE"/>
  </g>
  <text x="600" y="118" text-anchor="middle" class="t name">Prapti Chauhan</text>
  <text x="600" y="162" text-anchor="middle" class="t sub">Senior Flutter Developer  •  Fintech &amp; Blockchain</text>
</svg>
