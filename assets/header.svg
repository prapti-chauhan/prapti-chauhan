<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15150F"/>
      <stop offset="1" stop-color="#0F2A28"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E9E96" opacity="0.18"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .name{font-size:62px;font-weight:800;fill:#E9EDEE}
      .sub{font-size:22px;font-weight:500;fill:#A7ADB5}
      .num{font-size:30px;font-weight:800;fill:#1E9E96}
      .lbl{font-size:15px;font-weight:600;fill:#A7ADB5;letter-spacing:1.5px}
      .a1{opacity:0;animation:in .8s ease-out .1s forwards}
      .a2{opacity:0;animation:in .8s ease-out .4s forwards}
      .a3{opacity:0;animation:in .8s ease-out .7s forwards}
      .bar{transform-origin:0 0;transform:scaleY(0);animation:grow .7s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes grow{to{transform:scaleY(1)}}
    </style>
  </defs>
  <rect width="1200" height="280" rx="14" fill="url(#g)"/>
  <rect x="620" width="580" height="280" fill="url(#dots)"/>
  <rect x="70" y="62" width="6" height="156" rx="3" fill="#1E9E96" class="bar"/>
  <g class="a1">
    <text x="100" y="118" class="t name">Prapti Chauhan</text>
  </g>
  <g class="a2">
    <text x="102" y="158" class="t sub">Senior Flutter Developer  ·  Fintech &amp; Blockchain Apps</text>
  </g>
  <g class="a3">
    <text x="102" y="212" class="t"><tspan class="num">4+</tspan><tspan class="lbl" dx="10">YEARS</tspan><tspan class="num" dx="48">30+</tspan><tspan class="lbl" dx="10">APPS BUILT</tspan><tspan class="num" dx="48">10K+</tspan><tspan class="lbl" dx="10">USERS</tspan></text>
  </g>
</svg>
